name: Reviewed KiCad 10 hardware
on:
  push:
    paths: ['hardware/**', 'tools/**', 'bom/poa_interface_revision_2026-11-10.csv', '.github/workflows/hardware-review.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-checks:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kicad/kicad:10.0.8-full
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Configure standard libraries
        run: |
          mkdir -p "$HOME/.config/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table "$HOME/.config/kicad/10.0/sym-lib-table"
          cp /usr/share/kicad/template/fp-lib-table "$HOME/.config/kicad/10.0/fp-lib-table"
      - name: Native ERC, interface and PCB parity
        shell: bash
        run: |
          set +e
          out=hardware/review_2026-11-10
          mkdir -p "$out"
          kicad-cli sch erc --format json --severity-all --exit-code-violations -o "$out/ERC.json" hardware/kicad/panellog.kicad_sch
          erc=$?
          kicad-cli sch export netlist --format kicadxml -o "$out/netlist.xml" hardware/kicad/panellog.kicad_sch
          net=$?
          python3 tools/check_poa_netlist.py "$out/netlist.xml" --host > "$out/interface_check.json"
          interface=$?
          kicad-cli pcb drc --format json --severity-all --exit-code-violations --refill-zones --schematic-parity -o "$out/DRC.json" hardware/kicad/panellog.kicad_pcb
          drc=$?
          exit $((erc != 0 || net != 0 || interface != 0 || drc != 0))
      - name: Preserve native reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-10-review
          path: hardware/review_2026-11-10/
