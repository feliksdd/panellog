libraries:
  - symbols/panellog.kicad_sym

config:
  page_size: A3
  title: "PanelLog PV module logger and curtailment node"
  rev: "0.1"
  designer: "feliksdd"
  grid: 50
  strict_erc: false
  pcb_sheet_spacing: 25

power_nets:
  - GND
  - PV_PLUS
  - VCC_3V3

parts:
  "INA228AIDGSR": { mpn: "INA228AIDGSR", manufacturer: "Texas Instruments" }
  "LM5164DDAR": { mpn: "LM5164DDAR", manufacturer: "Texas Instruments" }
  "IPT015N10N5": { mpn: "IPT015N10N5", manufacturer: "Infineon" }
  "BVB-M-R0007-1.0 0.7mR": { mpn: "BVB-M-R0007-1.0", manufacturer: "Isabellenhuette" }
  "E73-2G4M08S1C": { mpn: "E73-2G4M08S1C", manufacturer: "Ebyte" }
  "M222 Pt1000 Class A external probe": { mpn: "32208572", manufacturer: "YAGEO Nexensos" }

sheets:
  power:
    components:
      - ref: U1
        symbol: PanelLog:LM5164DDAR
        value: "LM5164DDAR"
        pins: { "1": GND, "2": PV_PLUS, "3": UVLO, "4": RON, "5": FB, "6": PGOOD, "7": BST, "8": SW }

      - { ref: C1, symbol: PanelLog:C, value: "2.2uF 100V X7R", pins: { "1": PV_PLUS, "2": GND }, host: U1.2 }
      - { ref: C2, symbol: PanelLog:C, value: "100nF 100V X7R", pins: { "1": PV_PLUS, "2": GND }, host: U1.2 }
      - { ref: C3, symbol: PanelLog:C, value: "10uF 100V bulk/damping", pins: { "1": PV_PLUS, "2": GND } }

      - { ref: R1, symbol: PanelLog:R, value: "1.0M 1%", pins: { "1": PV_PLUS, "2": UVLO } }
      - { ref: R2, symbol: PanelLog:R, value: "200k 1%", pins: { "1": UVLO, "2": GND } }
      - { ref: R3, symbol: PanelLog:R, value: "27.4k 1%", pins: { "1": RON, "2": GND } }

      - { ref: C4, symbol: PanelLog:C, value: "2.2nF 50V X7R", pins: { "1": BST, "2": SW }, host: U1.7 }
      - { ref: L1, symbol: PanelLog:L, value: "68uH Isat>=1.8A", pins: { "1": SW, "2": VCC_3V3 } }

      - { ref: C5, symbol: PanelLog:C, value: "22uF 10V X7R", pins: { "1": VCC_3V3, "2": GND } }
      - { ref: C6, symbol: PanelLog:C, value: "22uF 10V X7R", pins: { "1": VCC_3V3, "2": GND } }
      - { ref: C7, symbol: PanelLog:C, value: "100nF 10V X7R", pins: { "1": VCC_3V3, "2": GND } }

      - { ref: R4, symbol: PanelLog:R, value: "175k 0.1%", pins: { "1": VCC_3V3, "2": FB } }
      - { ref: R5, symbol: PanelLog:R, value: "100k 0.1%", pins: { "1": FB, "2": GND } }

      - { ref: R6, symbol: PanelLog:R, value: "150k 1%", pins: { "1": SW, "2": RIPPLE } }
      - { ref: C8, symbol: PanelLog:C, value: "3.3nF X7R", pins: { "1": RIPPLE, "2": VCC_3V3 } }
      - { ref: C9, symbol: PanelLog:C, value: "150pF C0G", pins: { "1": RIPPLE, "2": FB } }

      - { ref: R7, symbol: PanelLog:R, value: "47k", pins: { "1": VCC_3V3, "2": PGOOD } }
      - { ref: D1, symbol: PanelLog:Zener, value: "DNP - TVS after cold-Voc/transient validation", dnp: true, pins: { "1": PV_PLUS, "2": GND } }

  measurement_switch:
    components:
      - { ref: J1, symbol: PanelLog:Conn_01x02, value: "PV MODULE IN / PV-rated pigtail", pins: { "1": PV_PLUS, "2": GND } }
      - { ref: J2, symbol: PanelLog:Conn_01x02, value: "MPPT OUT / PV-rated pigtail", pins: { "1": PV_PLUS, "2": MPPT_MINUS } }

      - { ref: RSH1, symbol: PanelLog:BVB_R0007, value: "BVB-M-R0007-1.0 0.7mR", pins: { "1": MPPT_MINUS, "2": SHUNT_RETURN } }

      - ref: Q1
        symbol: PanelLog:IPT015N10N5
        value: "IPT015N10N5"
        pins:
          bulk:
            GND: ["2","3","4","5","6","7","8"]
          named:
            "1": QSW_GATE
            "9": SHUNT_RETURN

      - { ref: R8, symbol: PanelLog:R, value: "220k 0.25W", pins: { "1": PV_PLUS, "2": QSW_GATE_BIAS } }
      - { ref: D2, symbol: PanelLog:Zener, value: "10V VGS clamp", pins: { "1": QSW_GATE_BIAS, "2": GND } }
      - { ref: R9, symbol: PanelLog:R, value: "100R", pins: { "1": QSW_GATE_BIAS, "2": QSW_GATE } }

      - { ref: Q2, symbol: PanelLog:NMOS, value: "2N7002", pins: { "1": SWITCH_OFF, "2": GND, "3": QSW_GATE_BIAS } }
      - { ref: R10, symbol: PanelLog:R, value: "100k", pins: { "1": SWITCH_OFF, "2": GND } }

      - ref: U2
        symbol: PanelLog:INA228AIDGSR
        value: "INA228AIDGSR"
        pins:
          "1": GND
          "2": GND
          "3": INA_ALERT
          "4": I2C_SDA
          "5": I2C_SCL
          "6": VCC_3V3
          "7": GND
          "8": VBUS_SENSE
          "9": INA_INM
          "10": INA_INP

      - { ref: R11, symbol: PanelLog:R, value: "10R", pins: { "1": MPPT_MINUS, "2": INA_INP } }
      - { ref: R12, symbol: PanelLog:R, value: "10R", pins: { "1": SHUNT_RETURN, "2": INA_INM } }
      - { ref: C10, symbol: PanelLog:C, value: "100nF C0G/X7R", pins: { "1": INA_INP, "2": INA_INM } }

      - { ref: R13, symbol: PanelLog:R, value: "10R", pins: { "1": PV_PLUS, "2": VBUS_SENSE } }
      - { ref: C11, symbol: PanelLog:C, value: "10nF 100V", pins: { "1": VBUS_SENSE, "2": GND } }

      - { ref: C12, symbol: PanelLog:C, value: "100nF", pins: { "1": VCC_3V3, "2": GND }, host: U2.6 }
      - { ref: C13, symbol: PanelLog:C, value: "1uF", pins: { "1": VCC_3V3, "2": GND }, host: U2.6 }

  logic_temperature:
    components:
      - ref: U3
        symbol: PanelLog:E73-2G4M08S1C
        value: "E73-2G4M08S1C"
        pins:
          bulk:
            VCC_3V3: ["19","23"]
            GND: ["5","21","24"]
          named:
            "3": PT1000_ADC
            "4": VCC_MON_ADC
            "7": NTC_ADC
            "11": XL1
            "12": I2C_SDA
            "13": XL2
            "14": I2C_SCL
            "16": SWITCH_OFF
            "20": PGOOD
            "22": INA_ALERT
            "26": RESET_N
            "37": SWDIO
            "39": SWDCLK

      - { ref: C14, symbol: PanelLog:C, value: "100nF", pins: { "1": VCC_3V3, "2": GND }, host: U3.19 }
      - { ref: C15, symbol: PanelLog:C, value: "4.7uF", pins: { "1": VCC_3V3, "2": GND }, host: U3.19 }

      - { ref: R14, symbol: PanelLog:R, value: "10k", pins: { "1": VCC_3V3, "2": I2C_SDA } }
      - { ref: R15, symbol: PanelLog:R, value: "10k", pins: { "1": VCC_3V3, "2": I2C_SCL } }
      - { ref: R16, symbol: PanelLog:R, value: "10k", pins: { "1": VCC_3V3, "2": INA_ALERT } }
      - { ref: R17, symbol: PanelLog:R, value: "10k", pins: { "1": VCC_3V3, "2": RESET_N } }

      - { ref: Y1, symbol: PanelLog:Crystal, value: "32.768kHz CL=12.5pF", pins: { "1": XL1, "2": XL2 } }
      - { ref: C16, symbol: PanelLog:C, value: "22pF C0G", pins: { "1": XL1, "2": GND } }
      - { ref: C17, symbol: PanelLog:C, value: "22pF C0G", pins: { "1": XL2, "2": GND } }

      - { ref: J3, symbol: PanelLog:Conn_01x02, value: "External Pt1000 probe", pins: { "1": PT1000_RAW, "2": GND } }
      - { ref: RT1, symbol: PanelLog:Pt1000, value: "M222 Pt1000 Class A external probe", pins: { "1": PT1000_RAW, "2": GND } }
      - { ref: R18, symbol: PanelLog:R, value: "14.7k 0.05% 10ppm/K", pins: { "1": VCC_3V3, "2": PT1000_RAW } }
      - { ref: R19, symbol: PanelLog:R, value: "1k", pins: { "1": PT1000_RAW, "2": PT1000_ADC } }
      - { ref: C18, symbol: PanelLog:C, value: "100nF", pins: { "1": PT1000_ADC, "2": GND } }

      - { ref: R20, symbol: PanelLog:R, value: "1k", pins: { "1": VCC_3V3, "2": VCC_MON_ADC } }
      - { ref: C19, symbol: PanelLog:C, value: "100nF", pins: { "1": VCC_MON_ADC, "2": GND } }

      - { ref: R21, symbol: PanelLog:R, value: "10k 1%", pins: { "1": VCC_3V3, "2": NTC_RAW } }
      - { ref: RT2, symbol: PanelLog:NTC, value: "10k NTC near Q1", pins: { "1": NTC_RAW, "2": GND } }
      - { ref: R22, symbol: PanelLog:R, value: "1k", pins: { "1": NTC_RAW, "2": NTC_ADC } }
      - { ref: C20, symbol: PanelLog:C, value: "100nF", pins: { "1": NTC_ADC, "2": GND } }

      - ref: J4
        symbol: PanelLog:Conn_01x05
        value: "SWD pogo"
        pins: { "1": VCC_3V3, "2": SWDIO, "3": SWDCLK, "4": RESET_N, "5": GND }

root:
  instantiate:
    - { sheet: power }
    - { sheet: measurement_switch }
    - { sheet: logic_temperature }
